name: Core tests and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test,parallel,pace,viirs,benchmark,publication]'
      - run: python -m pytest
      - run: python -m build
      - name: Smoke test installed wheel outside checkout
        shell: bash
        run: |
          python -m venv /tmp/terragpu-wheel
          /tmp/terragpu-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/terragpu-wheel/bin/python -c 'import terragpu; from importlib.util import find_spec; assert all(find_spec(p) is None for p in ("dask", "torch", "tensorflow", "sklearn", "terragpu.ai")); print(terragpu.__version__)'
          /tmp/terragpu-wheel/bin/terragpu-benchmark --size 64 --repeat 2 --warmup 0
