# Candidate for Linux V100/H100 raster-core qualification; run from repo root.
# RAPIDS/cuML requires a separate selector-generated compatible environment.
name: terragpu-cuda12
channels:
  - conda-forge
dependencies:
  - python=3.13
  - cuda-version=12.9
  - cupy>=14,<15
  - pip
  - pip:
      - -e .[test,parallel]
